<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#35d0e8"/>
      <stop offset="0.5" stop-color="#3a6ce8"/>
      <stop offset="1" stop-color="#8d3fe4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Les facettes en diagonale de l'icone Splitwise, rejouees en clair/sombre
         sur notre degrade plutot qu'en vert et anthracite. -->
    <path d="M0,0 L512,0 L0,512 Z" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M512,0 L512,512 L0,512 Z" fill="#0b1220" fill-opacity="0.3"/>
    <path d="M256,0 L512,256 L256,512 L0,256 Z" fill="#ffffff" fill-opacity="0.04"/>

    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>

  <!-- La maison ouverte de Splitwise : meme silhouette, meme proportions. -->
  <path d="M120,214 L256,104 L392,214 L392,404 L120,404 Z"
        fill="none" stroke="#ffffff" stroke-width="26"
        stroke-linejoin="round" stroke-linecap="round"/>

  <text x="256" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="205" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
</svg>
